openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: video
    description: Video downloader operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /info:
    post:
      operationId: getVideoInfo
      tags: [video]
      summary: Get video metadata
      description: Fetch video title, thumbnail, duration, platform, and available formats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUrlInput"
      responses:
        "200":
          description: Video metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoInfo"
        "400":
          description: Malformed URL (INVALID_URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Video needs a signed-in account (SIGN_IN_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Video deleted, private, or blocked in the server's region (VIDEO_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Link is not a single video (UNSUPPORTED_URL) or has no downloadable formats (NO_FORMATS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests from this network (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider failed in an unrecognised way (PROVIDER_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider refusing requests (PROVIDER_BLOCKED) or queue busy (QUEUE_BUSY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Provider did not respond in time (TIMEOUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /download:
    get:
      operationId: getDownloadFile
      tags: [video]
      summary: Download video file
      description: >
        Streams the selected format as a real media file (Content-Disposition
        attachment). Plain yt-dlp format ids pipe directly from the source;
        synthetic ids `video+audio:<height>` download the video and audio
        streams in parallel and mux them server-side into one file, and
        `mp3:<bitrate>` extracts MP3 audio (320/128).
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            description: The video URL
        - name: formatId
          in: query
          required: true
          schema:
            type: string
            description: "yt-dlp format id from VideoInfo.formats[].formatId; synthetic ids video+audio:<height> and mp3:<bitrate> trigger server-side merge/transcode"
      responses:
        "200":
          description: Media file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing required query parameters or invalid format id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (per IP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Download queue busy — retry after a few seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: getDownloadLink
      tags: [video]
      summary: Get download link for a video
      description: Get a direct download URL for the selected format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadInput"
      responses:
        "200":
          description: Download link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    VideoUrlInput:
      type: object
      properties:
        url:
          type: string
          description: The video URL to fetch info for
      required:
        - url

    VideoFormat:
      type: object
      properties:
        formatId:
          type: string
          description: "yt-dlp format identifier, or synthetic ids video+audio:<height> / mp3:<bitrate> handled by the download endpoint"
        type:
          type: string
          description: "progressive = one file with video AND audio; video = picture only, no sound; audio = sound only"
          enum:
            - progressive
            - video
            - audio
        quality:
          type: string
          description: "Human-readable quality label, e.g. 1080p, 720p, 360p, MP3 · 320 kbps"
        extension:
          type: string
          description: "Container extension, e.g. mp4, webm, m4a"
        filesize:
          type: number
          nullable: true
          description: File size in bytes when known, otherwise null. Check sizeIsEstimate before showing it as exact.
        sizeIsEstimate:
          type: boolean
          description: "True when filesize is derived (approx metadata, sum of merged streams, or a bitrate calculation) rather than an exact Content-Length. Absent means unknown provenance."
        filename:
          type: string
          description: Suggested file name including extension
      required:
        - formatId
        - type
        - quality
        - extension

    VideoInfo:
      type: object
      properties:
        title:
          type: string
        thumbnail:
          type: string
          description: Thumbnail URL
        duration:
          type: string
          description: Duration in HH:MM:SS or MM:SS format
        durationSeconds:
          type: number
          nullable: true
          description: Exact duration in seconds when the provider reports it, else null
        platform:
          type: string
          description: Platform name (YouTube, Instagram, etc.)
        formats:
          type: array
          items:
            $ref: "#/components/schemas/VideoFormat"
      required:
        - title
        - thumbnail
        - duration
        - platform
        - formats

    DownloadInput:
      type: object
      properties:
        url:
          type: string
          description: The video URL
        formatId:
          type: string
          description: "yt-dlp format id (from VideoInfo.formats[].formatId)"
      required:
        - url
        - formatId

    DownloadResult:
      type: object
      properties:
        downloadUrl:
          type: string
          description: Direct download URL
        filename:
          type: string
          description: Suggested filename
      required:
        - downloadUrl
        - filename

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable message that says what happened and what to do next
        code:
          type: string
          description: Stable machine-readable reason the UI switches on
          enum:
            - INVALID_URL
            - UNSUPPORTED_URL
            - VIDEO_UNAVAILABLE
            - SIGN_IN_REQUIRED
            - PROVIDER_BLOCKED
            - TIMEOUT
            - RATE_LIMITED
            - QUEUE_BUSY
            - NO_FORMATS
            - PROVIDER_ERROR
        retryable:
          type: boolean
          description: Whether offering the same link again could plausibly succeed
      required:
        - error

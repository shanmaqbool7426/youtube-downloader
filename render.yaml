services:
  - type: web
    name: hd-grab
    runtime: docker
    plan: free
    branch: render-deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      # The free instance has 512 MB RAM; each merged download runs two yt-dlp
      # processes plus ffmpeg, so keep parallel work low.
      - key: YTDLP_MAX_CONCURRENT
        value: "2"
      # One public host. The edge already redirects the apex to www, but keeping
      # the application redirect too means canonicals, sitemap URLs and redirects
      # stay aligned even if the edge rule is changed or bypassed. The value MUST
      # match DEFAULT_SITE_URL in artifacts/vidsnap/scripts/seo-head.mjs.
      - key: CANONICAL_HOST
        value: www.clipzap.net

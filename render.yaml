services:
  - type: web
    name: hd-grab
    runtime: docker
    plan: free
    branch: render-deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      # The free instance has 512 MB RAM; each merged download runs two yt-dlp
      # processes plus ffmpeg, so keep parallel work low.
      - key: YTDLP_MAX_CONCURRENT
        value: "2"
      # Redirects www.clipzap.net and the onrender.com URL to clipzap.net.
      # Uncomment ONLY after clipzap.net is added as a custom domain in Render
      # and its DNS is live, otherwise visitors get redirected to a dead domain.
      # - key: CANONICAL_HOST
      #   value: clipzap.net

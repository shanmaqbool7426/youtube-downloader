kind = "web"
previewPath = "/"
title = "VidSnap"
version = "1.0.0"
id = "artifacts/vidsnap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21921

[services.development]
run = "pnpm --filter @workspace/vidsnap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vidsnap", "run", "build" ]
serve = "static"
publicDir = "artifacts/vidsnap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
WEB_PORT = "21921"
WEB_HOST = "0.0.0.0"
API_TARGET = "http://127.0.0.1:8080"

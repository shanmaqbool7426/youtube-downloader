name: Checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: docker build -t vidsnap .
      - name: Check container startup
        run: |
          docker run -d --init --name vidsnap --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=2g,mode=1777 \
            -p 127.0.0.1:8080:8080 vidsnap
          trap 'docker logs vidsnap; docker rm -f vidsnap' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8080/api/healthz
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'VidSnap'
